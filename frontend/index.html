<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/WindStream.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindStream RMS — Remote Monitoring System</title>
    <meta name="description" content="WindStream Remote Monitoring System — Real-time hybrid energy monitoring platform for wind and solar assets." />
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
